name: release

# Ship a version: bump `version` in src-tauri/tauri.conf.json (and package.json +
# src-tauri/Cargo.toml to match), commit, then push a matching tag:
#
#   git tag dever-v0.2.0 && git push origin dever-v0.2.0
#
# This builds the installers, signs them for the updater, and attaches them to a
# DRAFT GitHub release. Publishing that release is what ships the update —
# `releases/latest/download/latest.json` only resolves for published releases, so
# nothing reaches the team until you press Publish.
on:
  push:
    tags:
      - 'dever-v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The team is on Windows. Add `macos-latest` (with
          # `--target aarch64-apple-darwin`) or `ubuntu-22.04` rows when someone
          # needs those bundles — the updater handles them the same way.
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the bundles so the updater will accept them. Without these the
          # build still succeeds but produces no updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: dever-v__VERSION__
          releaseName: "Dev'er v__VERSION__"
          releaseBody: 'Download the `-setup.exe` below to install. Existing installs update themselves from inside the app.'
          releaseDraft: true
          prerelease: false
          # The NSIS setup.exe installs per-user without admin rights, so updates
          # apply without a UAC prompt. Point the updater at it rather than the MSI.
          updaterJsonPreferNsis: true
          tauriScript: bun tauri
          args: ${{ matrix.args }}
